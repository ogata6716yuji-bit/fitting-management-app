<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>試着帳</title>
<meta name="theme-color" content="#c2410c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="試着帳">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
:root{--bg:#faf8f5;--fg:#222;--card:#fff;--ac:#c2410c;--bd:#d8d3cc;--mut:#777;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1b1a;--fg:#eee;--card:#2a2826;--ac:#fb923c;--bd:#444;--mut:#aaa}}
:root[data-theme="dark"]{--bg:#1c1b1a;--fg:#eee;--card:#2a2826;--ac:#fb923c;--bd:#444;--mut:#aaa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;font-size:15px;max-width:520px;margin:auto;padding:10px}
h1{font-size:18px;margin:6px 0}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
button,label.b{position:relative;overflow:hidden;display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 12px;font-size:14px;margin:3px 3px 3px 0;cursor:pointer}
button.s,label.s{background:transparent;color:var(--fg);border:1px solid var(--bd)}
input[type=file]{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;font-size:0}canvas{width:100%;border-radius:8px;touch-action:none;background:#8884;display:block}
.th{display:flex;gap:6px;overflow-x:auto;padding:4px 0}.th img{height:72px;border-radius:6px;border:2px solid transparent}.th img.on{border-color:var(--ac)}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}.row span{width:56px;font-size:13px}.row input{flex:1}
.m{color:var(--mut);font-size:12px;margin:4px 0}#ov{display:none;position:fixed;inset:0;background:#000d;z-index:9;padding:20px;text-align:center;color:#fff}#ov img{max-width:100%;max-height:80%}
</style></head><body>
<h1>👗 試着帳</h1>
<div class="card"><h2>① 人物写真（登録）</h2>
<label class="b">📷 撮影<input type="file" accept="image/*" capture="environment" id="pc"></label>
<label class="b s">🖼 画像を選ぶ<input type="file" accept="image/*" id="pf"></label>
<div class="th" id="th"></div><div class="m">登録した写真はこの端末のブラウザに保存されます。</div></div>

<div class="card"><h2>② 服の画像</h2>
<label class="b">📷 撮影<input type="file" accept="image/*" capture="environment" id="gc1"></label>
<label class="b s">🖼 画像を選ぶ<input type="file" accept="image/*" id="gf"></label>
<canvas id="gv" width="10" height="10" style="margin-top:8px"></canvas>
<div class="m">広告などは、服の部分を指でなぞって囲み「範囲で切り取り」を押します。</div>
<button class="s" id="crop">範囲で切り取り</button><button class="s" id="rst">元に戻す</button>
<div class="row"><span>許容差</span><input type="range" id="tol" min="10" max="120" value="45"></div>
<button id="cut">背景を消して試着へ</button><div class="m msgb" id="msg" style="color:var(--ac);font-weight:600"></div>
<div class="m">背景が無地（白い壁・床など）だとうまく消えます。</div></div>

<div class="card"><h2>③ 試着</h2><canvas id="fc" width="10" height="10"></canvas>
<div class="m msgb" style="color:var(--ac);font-weight:600"></div><div class="m">服の種類(自動判定。違う場合は選び直し):</div><div id="types"></div><div class="m">服は自動で体に合わせます。ドラッグで微調整できます。</div><button class="s" id="fb">顔の位置を指定</button><div id="sl"></div>
<button id="shot">合成画像を表示</button><button class="s" id="rs">調整をリセット</button></div>
<div id="ov"><p>画像を長押しして保存してください</p><img id="oi"><br><button onclick="ov.style.display='none'">閉じる</button></div>

<script>
const $=i=>document.getElementById(i);function msg(t){document.querySelectorAll('.msgb').forEach(m=>m.textContent=t)}
let persons=[],pi=-1,pimg=null,orig=null,src=null,g=null,tn=null,sel=null;
const D={dx:0,dy:0,s:1,r:0,sx:1,sy:1,h:0,sa:1,b:1,fz:1};let T={...D};let body=null,gtype='top',faceMan=null,setFace=0;
try{persons=JSON.parse(localStorage.getItem('fp')||'[]')}catch(e){}
function loadC(f,max){return new Promise(r=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);r(c)};im.src=URL.createObjectURL(f)})}
function saveP(){try{localStorage.setItem('fp',JSON.stringify(persons))}catch(e){}}
function th(){const t=$('th');t.innerHTML='';persons.forEach((d,i)=>{const im=new Image();im.src=d;if(i==pi)im.className='on';im.onclick=()=>pick(i);t.appendChild(im)})}
function pick(i){pi=i;const im=new Image();im.onload=()=>{pimg=im;const c=$('fc');c.width=im.width;c.height=im.height;th();body=null;draw();analyze()};im.src=persons[i]}
['pc','pf'].forEach(id=>$(id).onchange=async e=>{const f=e.target.files[0];if(!f)return;const c=await loadC(f,700);persons.push(c.toDataURL('image/jpeg',.8));saveP();pick(persons.length-1);e.target.value=''});
th();if(persons.length)pick(0);
// 服
function showG(){const v=$('gv');v.width=src.width;v.height=src.height;const x=v.getContext('2d');x.drawImage(src,0,0);if(sel){x.strokeStyle='#f0f';x.lineWidth=3;x.strokeRect(sel.x,sel.y,sel.w,sel.h)}}
['gc1','gf'].forEach(id=>$(id).onchange=async e=>{const f=e.target.files[0];if(!f)return;orig=await loadC(f,600);src=orig;sel=null;showG();msg('服の画像を読み込みました');e.target.value=''});
const gv=$('gv');let ds=null;
function gp(e){const r=gv.getBoundingClientRect();return{x:(e.clientX-r.left)*gv.width/r.width,y:(e.clientY-r.top)*gv.height/r.height}}
gv.onpointerdown=e=>{if(!src)return;ds=gp(e);gv.setPointerCapture(e.pointerId)};
gv.onpointermove=e=>{if(!ds)return;const p=gp(e);sel={x:Math.min(ds.x,p.x),y:Math.min(ds.y,p.y),w:Math.abs(p.x-ds.x),h:Math.abs(p.y-ds.y)};showG()};
gv.onpointerup=()=>ds=null;
$('crop').onclick=()=>{if(!src||!sel||sel.w<10||sel.h<10){msg('先に服の部分を指で囲んでください');return}const c=document.createElement('canvas');c.width=Math.round(sel.w);c.height=Math.round(sel.h);c.getContext('2d').drawImage(src,sel.x,sel.y,sel.w,sel.h,0,0,c.width,c.height);src=c;sel=null;showG()};
$('rst').onclick=()=>{if(orig){src=orig;sel=null;showG()}};
$('cut').onclick=()=>{if(!src){msg('先に②で服の画像を選んでください');return}
const w=src.width,h=src.height,x=src.getContext('2d'),id=x.getImageData(0,0,w,h),d=id.data,tol=+$('tol').value;
const cs=[[0,0],[w-1,0],[0,h-1],[w-1,h-1]].map(([a,b])=>{const i=(b*w+a)*4;return[d[i],d[i+1],d[i+2]]});
const near=i=>cs.some(c=>Math.hypot(d[i]-c[0],d[i+1]-c[1],d[i+2]-c[2])<tol);
const vis=new Uint8Array(w*h),st=[];
for(let i=0;i<w;i++){st.push(i,(h-1)*w+i)}for(let j=0;j<h;j++){st.push(j*w,j*w+w-1)}
while(st.length){const p=st.pop();if(vis[p])continue;if(!near(p*4))continue;vis[p]=1;const px=p%w,py=(p/w)|0;if(px>0)st.push(p-1);if(px<w-1)st.push(p+1);if(py>0)st.push(p-w);if(py<h-1)st.push(p+w)}
let x0=w,y0=h,x1=0,y1=0;for(let p=0;p<w*h;p++){if(vis[p])d[p*4+3]=0;else{const px=p%w,py=(p/w)|0;if(px<x0)x0=px;if(px>x1)x1=px;if(py<y0)y0=py;if(py>y1)y1=py}}
if(x1<=x0||y1<=y0){msg('服が見つかりません。許容差を下げてください');return}
const t=document.createElement('canvas');t.width=w;t.height=h;t.getContext('2d').putImageData(id,0,0);
g=document.createElement('canvas');g.width=x1-x0+1;g.height=y1-y0+1;g.getContext('2d').drawImage(t,x0,y0,g.width,g.height,0,0,g.width,g.height);
msg('');gtype=classify(g);setTypeUI();tint();draw();$('fc').scrollIntoView({behavior:'smooth'})};
function tint(){if(!g)return;const c=document.createElement('canvas');c.width=g.width;c.height=g.height;const x=c.getContext('2d');x.drawImage(g,0,0);const id=x.getImageData(0,0,c.width,c.height),d=id.data;
const a=T.h*Math.PI/180,co=Math.cos(a),si=Math.sin(a);
const M=[.213+co*.787-si*.213,.715-co*.715-si*.715,.072-co*.072+si*.928,.213-co*.213+si*.143,.715+co*.285+si*.14,.072-co*.072-si*.283,.213-co*.213-si*.787,.715-co*.715+si*.715,.072+co*.928+si*.072];
for(let i=0;i<d.length;i+=4){let r=d[i],gg=d[i+1],b=d[i+2];let R=M[0]*r+M[1]*gg+M[2]*b,G=M[3]*r+M[4]*gg+M[5]*b,B=M[6]*r+M[7]*gg+M[8]*b;const L=.299*R+.587*G+.114*B;R=L+(R-L)*T.sa;G=L+(G-L)*T.sa;B=L+(B-L)*T.sa;d[i]=Math.max(0,Math.min(255,R*T.b));d[i+1]=Math.max(0,Math.min(255,G*T.b));d[i+2]=Math.max(0,Math.min(255,B*T.b))}
x.putImageData(id,0,0);tn=c}
function classify(c){const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,Math.floor(h*.92),w,1).data;let runs=0,len=0;for(let i=0;i<w;i++){if(d[i*4+3]>40)len++;else{if(len>w*.06)runs++;len=0}}if(len>w*.06)runs++;return runs>=2?'pants':(h/w>1.35?'dress':'top')}
const TY=[['top','トップス'],['pants','パンツ'],['dress','ワンピース']];
function setTypeUI(){const e=$('types');e.innerHTML='';TY.forEach(([k,n])=>{const b=document.createElement('button');b.textContent=n;b.className=k==gtype?'':'s';b.onclick=()=>{gtype=k;setTypeUI();draw()};e.appendChild(b)})}
setTypeUI();
function calcBody(l,W,H){const P=i=>({x:l[i].x*W,y:l[i].y*H,v:l[i].visibility??1});const a=P(11),b=P(12),c=P(23),d=P(24);
const sm={x:(a.x+b.x)/2,y:(a.y+b.y)/2},hm={x:(c.x+d.x)/2,y:(c.y+d.y)/2},tor=Math.hypot(hm.x-sm.x,hm.y-sm.y),L=a.x<b.x?a:b,R=a.x<b.x?b:a;
const kn=[25,26].map(P),an=[27,28].map(P),ky=kn.every(p=>p.v>.5)?(kn[0].y+kn[1].y)/2:hm.y+tor*1.1,ay=an.every(p=>p.v>.5)?(an[0].y+an[1].y)/2:hm.y+tor*1.9;
const e1=P(2),e2=P(5),m1=P(9),m2=P(10),ey=(e1.y+e2.y)/2,my=(m1.y+m2.y)/2,u=Math.max(my-ey,tor*.1),t0=ey-u*1.5,t1=my+u,ry=(t1-t0)/2;
return{sm,hm,tor,sw:Math.hypot(R.x-L.x,R.y-L.y),hw:Math.hypot(c.x-d.x,c.y-d.y),ky,ay,rot:Math.atan2(R.y-L.y,R.x-L.x),face:{x:(e1.x+e2.x+m1.x+m2.x)/4,y:(t0+t1)/2,rx:ry*.8,ry}}}
function defBody(W,H){return{sm:{x:W/2,y:H*.25},hm:{x:W/2,y:H*.5},tor:H*.25,sw:W*.35,hw:W*.28,ky:H*.72,ay:H*.92,rot:0,face:{x:W/2,y:H*.14,rx:W*.07,ry:W*.09}}}
async function analyze(){if(!pimg)return;const my=pi;msg('AIで人物を解析中…(初回は読み込みに時間がかかります)');for(let i=0;i<60&&!window.detectPose;i++)await new Promise(r=>setTimeout(r,100));
const c=document.createElement('canvas');c.width=pimg.width;c.height=pimg.height;c.getContext('2d').drawImage(pimg,0,0);const l=window.detectPose?await window.detectPose(c):null;if(my!==pi)return;
if(l){body=calcBody(l,pimg.width,pimg.height);msg('')}else{body=null;msg('自動位置合わせができませんでした。手動で調整してください')}draw()}
function draw(){const c=$('fc'),x=c.getContext('2d');if(!pimg){x.clearRect(0,0,c.width,c.height);return}const W=c.width,H=c.height;x.drawImage(pimg,0,0,W,H);if(!tn)return;
const B=body||defBody(W,H),ar=tn.height/tn.width;let cx,ty,w,h,tp=1;
if(gtype=='pants'){cx=B.hm.x;ty=B.hm.y-.12*B.tor;w=B.hw*2.1;h=(B.ay-ty)*1.02}
else if(gtype=='dress'){cx=B.sm.x;ty=B.sm.y-.14*B.tor;w=B.sw*1.9;h=(B.ky-ty)*1.1}
else{cx=B.sm.x;ty=B.sm.y-.14*B.tor;w=B.sw*1.9;h=Math.min(Math.max(w*ar,B.tor),B.tor*1.6);tp=Math.min(1.05,Math.max(.8,B.hw/B.sw))}
w*=T.s*T.sx;h*=T.s*T.sy;cx+=T.dx*W;ty+=T.dy*H;
x.save();x.translate(cx,ty);x.rotate(B.rot+T.r*Math.PI/180);const N=40,sh=tn.height/N;
for(let j=0;j<N;j++){const t=j/(N-1),f=1+(tp-1)*t*t*(3-2*t),dw=w*f;x.drawImage(tn,0,j*sh,tn.width,sh+.6,-dw/2,j*h/N,dw,h/N+.8)}
x.restore();
if(T.fz>.01){const F=faceMan?{x:faceMan.x*W,y:faceMan.y*H,rx:W*.07,ry:W*.09}:B.face,o=document.createElement('canvas');o.width=W;o.height=H;const q=o.getContext('2d');q.drawImage(pimg,0,0,W,H);q.globalCompositeOperation='destination-in';q.translate(F.x,F.y);q.scale(F.rx*T.fz,F.ry*T.fz);const gr=q.createRadialGradient(0,0,.7,0,0,1);gr.addColorStop(0,'#000');gr.addColorStop(1,'#0000');q.fillStyle=gr;q.fillRect(-2,-2,4,4);x.drawImage(o,0,0)}}
let dm=null;const fc=$('fc');
const rp=e=>{const r=fc.getBoundingClientRect();return{px:(e.clientX-r.left)/r.width,py:(e.clientY-r.top)/r.height}};
fc.onpointerdown=e=>{const p=rp(e);if(setFace){faceMan={x:p.px,y:p.py};setFace=0;msg('');draw();return}dm=p;fc.setPointerCapture(e.pointerId)};
fc.onpointermove=e=>{if(!dm||!tn)return;const p=rp(e);T.dx+=p.px-dm.px;T.dy+=p.py-dm.py;dm=p;draw()};
fc.onpointerup=()=>dm=null;
$('fb').onclick=()=>{setFace=1;msg('人物の顔の中心をタップしてください')};
const SL=[['s','サイズ',.3,2.5,.01],['sx','幅',.5,1.8,.01],['sy','丈',.4,1.8,.01],['r','回転',-30,30,1],['h','色相',0,360,1,1],['sa','彩度',0,2,.01,1],['b','明るさ',.5,1.5,.01,1],['fz','顔の保護',0,2,.01]];
function sliders(){$('sl').innerHTML='';SL.forEach(([k,n,mi,ma,st,col])=>{const r=document.createElement('div');r.className='row';r.innerHTML=`<span>${n}</span><input type="range" min="${mi}" max="${ma}" step="${st}" value="${T[k]}">`;r.querySelector('input').oninput=e=>{T[k]=+e.target.value;if(col)tint();draw()};$('sl').appendChild(r)})}
sliders();
$('rs').onclick=()=>{T={...D};sliders();tint();draw()};
$('shot').onclick=()=>{if(!pimg)return;$('oi').src=$('fc').toDataURL('image/png');$('ov').style.display='block'};
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('./sw.js')}catch(e){}}
</script>
<script type="module">
let lm=null,ld=null;
async function init(){const B='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',v=await import(B+'/vision_bundle.mjs'),f=await v.FilesetResolver.forVisionTasks(B+'/wasm');
lm=await v.PoseLandmarker.createFromOptions(f,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task'},runningMode:'IMAGE',numPoses:1})}
window.detectPose=async c=>{try{if(!lm){ld=ld||init();await ld}const r=lm.detect(c);return r.landmarks[0]||null}catch(e){ld=null;return null}};
</script>
</body></html>
